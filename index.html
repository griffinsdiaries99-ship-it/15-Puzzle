<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15 Puzzle — 4x4 Sliding Puzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23FF6B00'/><text x='50%' y='65%' font-family='Fredoka, Arial, sans-serif' font-weight='700' font-size='55' fill='white' text-anchor='middle'>15</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --grad1: #ff5ea8;
    --grad2: #7b5cff;
    --panel: rgba(255,255,255,0.07);
    --panel-border: rgba(255,255,255,0.14);
    --tile-a: #21e6a8;
    --tile-b: #0aa987;
    --tile-correct-a: #ff9a3c;
    --tile-correct-b: #ff5e62;
    --text: #fff6f0;
    --muted: #d9c9ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #241a3d 0%, #341b52 45%, #1c1032 100%);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Baloo 2', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 15px 60px;
    overflow-x: hidden;
  }
  .title-card {
    position: relative;
    width: min(92vw, 480px);
    padding: 26px 20px 22px;
    border-radius: 20px;
    text-align: center;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.10) 0px, rgba(255,255,255,0.10) 10px, transparent 10px, transparent 20px),
      linear-gradient(120deg, var(--grad2), var(--grad1) 55%, #ff8a4c 100%);
    box-shadow: 0 14px 34px rgba(123, 92, 255, 0.35);
    overflow: hidden;
  }
  .title-card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 20% 0%, rgba(255,255,255,0.25), transparent 55%);
    pointer-events: none;
  }
  h1 {
    margin: 0;
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(2rem, 8vw, 2.6rem);
    letter-spacing: 0.5px;
    text-shadow: 0 4px 0 rgba(0,0,0,0.18);
  }
  p.subtitle {
    margin: 6px 0 0;
    color: rgba(255,255,255,0.92);
    font-size: 0.95rem;
    font-weight: 600;
  }

  .top-row {
    width: min(92vw, 480px);
    display: flex;
    align-items: stretch;
    justify-content: space-between;
    gap: 14px;
    margin: 24px 0 18px;
  }
  #newGameBtn {
    font-family: 'Baloo 2', sans-serif;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 0 22px;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,0.18);
    transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
  }
  #newGameBtn:hover { filter: brightness(1.2); }
  #newGameBtn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.18);
  }
  .stat-box {
    display: flex;
    gap: 22px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    padding: 10px 22px;
    border-radius: 14px;
  }
  .stat-box .stat { text-align: center; }
  .stat-box .stat-label {
    display: block;
    font-size: 0.68rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .stat-box .stat-value {
    font-family: 'Fredoka', sans-serif;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
  }

  .board-wrap {
    position: relative;
    width: min(92vw, 480px);
  }
  .board {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: transparent;
    border: none;
    box-shadow: none;
    transition: filter 0.2s ease, opacity 0.2s ease;
    overflow: visible;
  }
  .board.paused {
    filter: blur(8px);
    opacity: 0.5;
    pointer-events: none;
  }

  /* Positioning wrapper: handles the SLIDE via transform, animated by CSS transition */
  .tile-pos {
    position: absolute;
    top: 0;
    left: 0;
    transition: transform 0.16s cubic-bezier(0.4, 0, 0.2, 1);
    will-change: transform;
  }
  .board.no-anim .tile-pos {
    transition: none !important;
  }

  /* Visual tile: handles color, hover, and the BOUNCE (scale) independent of slide transform */
  .tile {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    user-select: none;
    background: linear-gradient(150deg, var(--tile-a), var(--tile-b));
    box-shadow: 0 6px 0 rgba(0,0,0,0.22), 0 8px 14px rgba(0,0,0,0.25);
    transition: background 0.25s ease, box-shadow 0.25s ease, filter 0.15s ease;
  }
  .tile:hover { filter: brightness(1.08); }
  .tile:active { filter: brightness(0.95); }
  .tile.correct {
    background: linear-gradient(150deg, var(--tile-correct-a), var(--tile-correct-b));
    box-shadow: 0 6px 0 rgba(120,50,10,0.35), 0 8px 16px rgba(255,120,60,0.3);
  }
  .tile.bounce {
    animation-duration: 0.5s;
    animation-name: bounceTile;
  }
  @keyframes bounceTile {
    from, 20%, 40%, 60%, 80%, to {
      animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
    }
    0%   { transform: scale3d(0.3, 0.3, 0.3); }
    20%  { transform: scale3d(1.1, 1.1, 1.1); }
    40%  { transform: scale3d(0.9, 0.9, 0.9); }
    60%  { transform: scale3d(1.03, 1.03, 1.03); }
    80%  { transform: scale3d(0.97, 0.97, 0.97); }
    to   { transform: scale3d(1, 1, 1); }
  }
  .tile.correct-flash { animation: correctFlash 0.4s ease; }
  @keyframes correctFlash {
    0%   { filter: brightness(1); }
    45%  { filter: brightness(1.4); }
    100% { filter: brightness(1); }
  }

  .pause-btn {
    width: min(92vw, 480px);
    margin-top: 20px;
    font-family: 'Baloo 2', sans-serif;
    background: linear-gradient(135deg, var(--grad2), var(--grad1));
    color: white;
    border: none;
    padding: 14px 24px;
    border-radius: 14px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,0.25);

  .pause-btn:hover { filter: brightness(1.08); }
  .pause-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.25);
  }

  .bottom-row {
    width: min(92vw, 480px);

    align-items: center;
    justify-content: space-between;
    gap: 18px;

  .dpad { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .dpad-mid { display: flex; gap: 8px; }
  .dpad button {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);

    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 0 rgba(0,0,0,0.18);
    transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
  }
  .dpad button:hover { filter: brightness(1.2); }
  .dpad button:active {
    transform: translateY(2px);

  }
  .hint { flex: 1; font-size: 1.5rem; color: var(--muted); line-height: 1.4; }
  .hint b { color: #fff; }

  .win-overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;

  .win-overlay.show { display: flex; }
  .win-card {
    position: relative;

    background: linear-gradient(160deg, #ffffff, #fbeaff);
    color: #3a2560;
    padding: 30px 34px;
    border-radius: 20px;
    text-align: center;

    animation: popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    min-width: 240px;

    0%   { transform: scale(0.4) translateY(20px); opacity: 0; }
    70%  { transform: scale(1.06); opacity: 1; }
    100% { transform: scale(1); }
  }
  .win-card h2 {
    font-family: 'Fredoka', sans-serif;
    margin: 0 0 6px;
    font-size: 2rem;
    background: linear-gradient(120deg, #ff5ea8, #7b5cff);

    background-clip: text;
    color: transparent;
  }
  .win-card p { margin: 4px 0 18px; font-size: 1rem; color: #5b4a7a; }
  .win-card p b { color: #7b5cff; }
  .win-card button {
    font-family: 'Baloo 2', sans-serif;
    background: linear-gradient(135deg, var(--grad2), var(--grad1));
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,0.25);
  }
  .confetti {
    position: absolute;
    top: -10px;
    width: 8px;
    height: 14px;
    opacity: 0.9;
    border-radius: 2px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(420px) rotate(360deg); opacity: 0; }
  }

  .footer {
    width: min(92vw, 480px);
    margin-top: 34px;
    border-radius: 16px;
    overflow: hidden;
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));

  .footer-text {
    text-align: center;
    padding: 14px 14px 2px;
    font-size: 0.85rem;
    color: var(--muted);

  .footer-text b { color: #fff; }
  .footer-text .heart { color: #ff5e8a; }
  .social-row {
    display: flex;
    justify-content: center;
    gap: 14px;
    padding: 10px 0 18px;
  }
  .social-row a {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-decoration: none;

  .social-row a:hover {
    background: rgba(255,255,255,0.2);
    transform: translateY(-2px);
  }
  .social-row svg { width: 16px; height: 16px; fill: currentColor; }
</style>

<script>
  const SIZE = 4;
  const TOTAL = SIZE * SIZE; // 16 cells, 15 tiles + 1 blank
  const GAP = Math.max(4, Math.round(56 / SIZE));

  const boardEl = document.getElementById('board');
  const moveCountEl = document.getElementById('moveCount');
  const timerEl = document.getElementById('timer');
  const winOverlay = document.getElementById('winOverlay');
  const finalMovesEl = document.getElementById('finalMoves');
  const finalTimeEl = document.getElementById('finalTime');
  const pauseBtn = document.getElementById('pauseBtn');

  // cellOfValue[v] = current cell index of tile with number v (1..TOTAL-1)
  // valueAtCell[i] = value sitting in cell i (0 = blank)
  let cellOfValue = [];
  let valueAtCell = [];
  let tileEls = [];      // tileEls[v] = { pos: wrapperDiv, face: innerDiv }
  let tileSize = 0;

  let moveCount = 0;
  let elapsedSeconds = 0;
  let timerInterval = null;
  let gameWon = false;
  let gameStarted = false;
  let isPaused = false;

  function solvedMapping() {
    // value v's correct/starting cell is v-1
    const cov = new Array(TOTAL);
    const vac = new Array(TOTAL);
    for (let v = 1; v < TOTAL; v++) { cov[v] = v - 1; vac[v - 1] = v; }
    cov[0] = TOTAL - 1; // blank's "value 0" not used positionally, kept for symmetry
    vac[TOTAL - 1] = 0;
    return { cov, vac };
  }

  function isSolved() {
    for (let v = 1; v < TOTAL; v++) {
      if (cellOfValue[v] !== v - 1) return false;
    }
    return true;
  }

  function countInversionsFromOrder(order) {
    let inv = 0;
    for (let i = 0; i < order.length; i++) {
      for (let j = i + 1; j < order.length; j++) {
        if (order[i] > order[j]) inv++;
      }
    }
    return inv;
  }

  function isSolvableOrder(vac) {
    const flat = vac.filter(v => v !== 0);
    const inv = countInversionsFromOrder(flat);
    const blankIndex = vac.indexOf(0);
    const blankRowFromTop = Math.floor(blankIndex / SIZE);
    const blankRowFromBottom = SIZE - blankRowFromTop;
    if (SIZE % 2 === 0) {
      return (inv + blankRowFromBottom) % 2 === 1;
    } else {
      return inv % 2 === 0;
    }
  }

  function randomSolvableMapping() {
    let vac, cov;
    do {
      vac = new Array(TOTAL);
      for (let i = 0; i < TOTAL; i++) vac[i] = i === TOTAL - 1 ? 0 : i + 1;
      for (let i = vac.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [vac[i], vac[j]] = [vac[j], vac[i]];
      }
      cov = new Array(TOTAL);
      for (let i = 0; i < TOTAL; i++) cov[vac[i]] = i;
    } while (!isSolvableOrder(vac) || (function () {
      for (let v = 1; v < TOTAL; v++) if (cov[v] !== v - 1) return false;
      return true;
    })());
    return { cov, vac };
  }

  function formatTime(sec) {
    const mins = Math.floor(sec / 60);
    const secs = sec % 60;
    return mins > 0 ? (mins + ':' + String(secs).padStart(2, '0')) : (secs + 's');
  }

  function measure() {
    const rect = boardEl.getBoundingClientRect();
    tileSize = (rect.width - (SIZE - 1) * GAP) / SIZE;
  }

  function createTiles() {
    boardEl.innerHTML = '';
    tileEls = new Array(TOTAL);
    for (let v = 1; v < TOTAL; v++) {
      const pos = document.createElement('div');
      pos.className = 'tile-pos';
      const face = document.createElement('div');
      face.className = 'tile';
      face.textContent = v;
      face.addEventListener('click', () => attemptMoveValue(v));
      pos.appendChild(face);
      boardEl.appendChild(pos);
      tileEls[v] = { pos, face };
    }
  }

  function placeTile(v, instant) {
    const index = cellOfValue[v];
    const row = Math.floor(index / SIZE);
    const col = index % SIZE;
    const x = col * (tileSize + GAP);
    const y = row * (tileSize + GAP);
    const { pos, face } = tileEls[v];
    pos.style.width = tileSize + 'px';
    pos.style.height = tileSize + 'px';
    pos.style.fontSize = Math.round(tileSize * 0.52) + 'px';
    pos.style.transform = `translate(${x}px, ${y}px)`;
    const isCorrect = index === v - 1;
    face.classList.toggle('correct', isCorrect);
  }

  function placeAll(instant) {
    measure();
    if (instant) boardEl.classList.add('no-anim');
    for (let v = 1; v < TOTAL; v++) placeTile(v);
    if (instant) {
      requestAnimationFrame(() => boardEl.classList.remove('no-anim'));
    }
  }

  function newGame() {
    const mapping = randomSolvableMapping();
    cellOfValue = mapping.cov;
    valueAtCell = mapping.vac;

    moveCount = 0;
    elapsedSeconds = 0;
    gameWon = false;
    gameStarted = false;
    isPaused = false;
    moveCountEl.textContent = '0';
    timerEl.textContent = formatTime(0);
    winOverlay.classList.remove('show');
    boardEl.classList.remove('paused');
    pauseBtn.textContent = 'Pause';
    pauseBtn.disabled = false;
    stopTimer();
    placeAll(true);
  }

  function startTimer() {
    stopTimer();
    timerInterval = setInterval(() => {
      elapsedSeconds++;
      timerEl.textContent = formatTime(elapsedSeconds);
    }, 1000);
  }

  function stopTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = null;
  }

  function togglePause() {
    if (!gameStarted || gameWon) return;
    isPaused = !isPaused;
    if (isPaused) {
      stopTimer();
      boardEl.classList.add('paused');
      pauseBtn.textContent = 'Resume';
    } else {
      startTimer();
      boardEl.classList.remove('paused');
      pauseBtn.textContent = 'Pause';
    }
  }

  function getNeighborCells(index) {
    const row = Math.floor(index / SIZE);
    const col = index % SIZE;
    const neighbors = [];
    if (row > 0) neighbors.push(index - SIZE);
    if (row < SIZE - 1) neighbors.push(index + SIZE);
    if (col > 0) neighbors.push(index - 1);
    if (col < SIZE - 1) neighbors.push(index + 1);
    return neighbors;
  }

  function spawnConfetti() {
    const colors = ['#ff5ea8', '#7b5cff', '#00d9a3', '#ffce54', '#ff8a4c'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + '%';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDuration = (1 + Math.random() * 1.2) + 's';
      c.style.animationDelay = (Math.random() * 0.4) + 's';
      winOverlay.appendChild(c);
      setTimeout(() => c.remove(), 2600);
    }
  }

  function attemptMoveValue(v) {
    if (gameWon || isPaused) return;
    const index = cellOfValue[v];
    const blankIndex = valueAtCell.indexOf(0);
    const neighbors = getNeighborCells(index);
    if (!neighbors.includes(blankIndex)) return;

    if (!gameStarted) {
      gameStarted = true;
      startTimer();
    }

    // swap in the mapping — only this one tile physically moves
    valueAtCell[blankIndex] = v;
    valueAtCell[index] = 0;
    cellOfValue[v] = blankIndex;

    moveCount++;
    moveCountEl.textContent = moveCount;

    placeTile(v);
    const { face } = tileEls[v];
    face.classList.remove('bounce', 'correct-flash');
    void face.offsetWidth; // restart animation
    face.classList.add('bounce');
    if (cellOfValue[v] === v - 1) face.classList.add('correct-flash');

    if (isSolved()) {
      gameWon = true;
      stopTimer();
      pauseBtn.disabled = true;
      finalMovesEl.textContent = moveCount;
      finalTimeEl.textContent = formatTime(elapsedSeconds);
      setTimeout(() => {
        winOverlay.classList.add('show');
        spawnConfetti();
      }, 250);
    }
  }

  function moveDirection(dir) {
    if (isPaused || gameWon) return;
    const blankIndex = valueAtCell.indexOf(0);
    const row = Math.floor(blankIndex / SIZE);
    const col = blankIndex % SIZE;
    let targetIndex = null;
    if (dir === 'up' && row < SIZE - 1) targetIndex = blankIndex + SIZE;
    if (dir === 'down' && row > 0) targetIndex = blankIndex - SIZE;
    if (dir === 'left' && col < SIZE - 1) targetIndex = blankIndex + 1;
    if (dir === 'right' && col > 0) targetIndex = blankIndex - 1;
    if (targetIndex !== null) attemptMoveValue(valueAtCell[targetIndex]);
  }

  document.getElementById('newGameBtn').addEventListener('click', newGame);
  document.getElementById('playAgainBtn').addEventListener('click', newGame);
  pauseBtn.addEventListener('click', togglePause);

  document.getElementById('upBtn').addEventListener('click', () => moveDirection('up'));
  document.getElementById('downBtn').addEventListener('click', () => moveDirection('down'));
  document.getElementById('leftBtn').addEventListener('click', () => moveDirection('left'));
  document.getElementById('rightBtn').addEventListener('click', () => moveDirection('right'));

  document.addEventListener('keydown', (e) => {
    const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
    if (map[e.key]) {
      e.preventDefault();
      moveDirection(map[e.key]);
    }
  });

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => placeAll(true), 100);
  });

  createTiles();
  newGame();
</script>

</body>
</html>
